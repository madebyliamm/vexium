# Checks on every pull request and on every branch except main (main is covered by the Pages workflow, which runs the same
# studio checks before it deploys). Nothing here deploys or touches secrets.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Typecheck
        working-directory: studio
        run: npm run typecheck
      - name: Unit tests
        working-directory: studio
        run: npm test
      - name: Build + assemble the site
        run: |
          npm run build --prefix studio
          node scripts/assemble-site.mjs --out _site

  platform-tests:
    # The backend/SDK/Worker unit suites that need no network and no install (Node strips the TypeScript itself).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit suites
        run: node --test supabase/tests/site_api.test.ts supabase/tests/auth_gate.test.ts sdk/test/sdk_v1.test.ts 'publisher/test/*.test.ts' cf-worker/test/stream_parser.test.ts
