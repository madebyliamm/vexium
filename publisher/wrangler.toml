name = "vexium-publisher"          # same Worker name as before, so the existing routes/custom-domain proxy keep pointing at it
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Published files: immutable versions at p/<project_id>/v<n>/<path>.
# One-time:  npx wrangler r2 bucket create vertly-sites
[[r2_buckets]]
binding = "SITES"
bucket_name = "vertly-sites"

